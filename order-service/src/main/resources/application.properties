server.port=${PORT:8082}
spring.application.name=order-service

# TiDB Cloud MySQL Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/micro_order_db}?sslmode=require&useSSL=true&verifyServerCertificate=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Karthick@#2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true