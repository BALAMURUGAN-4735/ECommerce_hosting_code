server.port=${PORT:8080}
spring.application.name=api-gateway-service

# Direct HTTPS Microservice Routing for Render
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=https://ecommerce-hosting-code-user.onrender.com
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=https://ecommerce-hosting-code-product.onrender.com
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=https://ecommerce-hosting-code-order.onrender.com
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[3].id=distribution-service
spring.cloud.gateway.routes[3].uri=https://ecommerce-hosting-code-distribution.onrender.com
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/distribution/**

spring.cloud.gateway.routes[4].id=admin-service
spring.cloud.gateway.routes[4].uri=https://ecommerce-hosting-code-admin.onrender.com
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/**

# Global CORS Configuration (Vercel Frontend Support)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST